# Publishes a GitHub Release.  To release, bump VERSION on master:
#
#   echo 1.1.0 > VERSION      # and add a "## [1.1.0]" section to CHANGELOG.md
#   git commit -am "Release 1.1.0" && git push origin master
#
# The workflow then tags that commit v1.1.0 and publishes the release.
# Pushing a v* tag yourself works too.  A version that already has a release
# is skipped, so re-running or pushing again is harmless.
#
# Before publishing it checks VERSION against CHANGELOG.md (and the tag, if
# one was pushed), runs the test suite, and verifies the offline bundle, so a
# release is never cut from a tree whose bundle is incomplete or damaged.
# The release carries dyode-<version>.tar.gz (the whole repository, offline
# bundle included), its SHA-256, and (since 1.6.0) GPG signatures: the
# tarball holds SHA256SUMS of every file and SHA256SUMS.sig, which
# install.sh checks with gpgv; dyode-<version>.tar.gz.sig and
# dyode-release.pub are attached for checking the download itself.
# Signing needs the DYODE_RELEASE_KEY and DYODE_RELEASE_KEY_PASSPHRASE
# secrets (tools/release-key.sh); without them the release fails.
name: Release

on:
  push:
    branches: [master]
    paths:
      - VERSION
      - .github/workflows/release.yml
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write          # needed by the reused bundle workflow

jobs:
  # Rebuild the offline bundle from today's archives and fail if it differs
  # from the committed one: a release never ships stale security updates.
  bundle:
    uses: ./.github/workflows/offline-bundle.yml
    with:
      mode: check

  release:
    needs: bundle
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the version
        id: version
        run: |
          version="$(cat VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($version)"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.version.outputs.skip != 'true'
        run: |
          python -m pip install --quiet pyyaml "pymodbus>=3.12,<3.13"   # real-server Modbus test
          python -m unittest discover -s tests

      - name: Verify the offline bundle
        if: steps.version.outputs.skip != 'true'
        run: |
          tools/build_wheelhouse.sh --verify
          for d in packaging/debs/*/*/; do
            (cd "$d" && sha256sum --quiet -c SHA256SUMS) && echo "ok  $d"
          done

      - name: Package and sign
        if: steps.version.outputs.skip != 'true'
        env:
          DYODE_RELEASE_KEY: ${{ secrets.DYODE_RELEASE_KEY }}
          DYODE_RELEASE_KEY_PASSPHRASE: ${{ secrets.DYODE_RELEASE_KEY_PASSPHRASE }}
        run: |
          version="$(cat VERSION)"
          name="dyode-$version"
          # SHA256SUMS of every file + its signature go into the tarball,
          # where install.sh checks them before installing anything.
          tools/sign_release.sh
          # The same check a user's box will make, on the real tarball.
          mkdir check && tar xzf "$name.tar.gz" -C check
          (cd "check/$name" && ./install.sh --verify-only)
          # This version's CHANGELOG section becomes the release notes.
          awk -v v="[$version]" '/^## \[/ { p = index($0, v) > 0; next } p' \
            CHANGELOG.md > notes.md
          {
            echo
            echo "Offline bundle built $(sed -n 's/^built=//p' packaging/BUILD-INFO)."
            echo "Signing key: \`$(gpg --show-keys --with-colons packaging/dyode-release.pub | awk -F: '/^fpr:/ {print $10; exit}')\`"
          } >> notes.md
          ls -l "$name".tar.gz*

      - name: Publish
        if: steps.version.outputs.skip != 'true'
        run: |
          version="$(cat VERSION)"
          # Creates tag v<version> at this commit if it does not exist yet.
          gh release create "v$version" --target "$GITHUB_SHA" \
            "dyode-$version.tar.gz" "dyode-$version.tar.gz.sha256" \
            "dyode-$version.tar.gz.sig" packaging/dyode-release.pub \
            --title "DYODE $version" --notes-file notes.md
